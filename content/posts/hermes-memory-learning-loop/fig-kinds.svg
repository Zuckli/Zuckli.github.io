<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-label="四类经验介质对比：工作记忆、记忆文件、技能、会话数据库，各自的容量、写入者与读取时机">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; fill: #1f2328; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #6b6b6b; }
    .h { font-size: 10.5px; font-weight: 600; fill: #6b6b6b; letter-spacing: .1em; }
    .name { font-size: 14px; font-weight: 600; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
    .cell { font-size: 11.5px; fill: #3d3d3d; }
    .small { font-size: 10.5px; fill: #6b6b6b; }
    .note { font-size: 11.4px; fill: #6b6b6b; }
  </style>
  <rect width="800" height="430" fill="#fbfaf7"/>
  <text x="30" y="38" class="title">四类经验，四种寿命</text>
  <text x="30" y="60" class="sub">同一句话放错介质，要么占掉本就不多的预算，要么在需要时读不到。</text>

  <!-- 表头 -->
  <text x="30" y="96" class="h">介质</text>
  <text x="200" y="96" class="h">写什么</text>
  <text x="430" y="96" class="h">容量与寿命</text>
  <text x="640" y="96" class="h">什么时候进上下文</text>
  <line x1="30" y1="106" x2="770" y2="106" stroke="#e5e1d8"/>

  <!-- 行 1 工作记忆 -->
  <g>
    <rect x="24" y="114" width="752" height="66" rx="8" fill="#ffffff" stroke="#f0ece3"/>
    <rect x="24" y="126" width="3" height="42" rx="1.5" fill="#d9772f"/>
    <text x="36" y="140" class="name">上下文窗口</text>
    <text x="36" y="158" class="small">工作记忆</text>
    <text x="200" y="138" class="cell">这一轮的全部工具结果、报错、你的纠正</text>
    <text x="200" y="158" class="small">最快、最贵、最短暂的一种</text>
    <text x="430" y="138" class="cell">模型窗口上限</text>
    <text x="430" y="158" class="small">会话结束即丢弃（压到阈值后摘要）</text>
    <text x="640" y="145" class="cell">始终在</text>
  </g>

  <!-- 行 2 记忆 -->
  <g>
    <rect x="24" y="188" width="752" height="66" rx="8" fill="#ffffff" stroke="#f0ece3"/>
    <rect x="24" y="200" width="3" height="42" rx="1.5" fill="#2f8a5b"/>
    <text x="36" y="214" class="mono">MEMORY.md</text>
    <text x="36" y="232" class="small">+ USER.md</text>
    <text x="200" y="212" class="cell">跨任务都成立的事实：环境、约定、你是谁</text>
    <text x="200" y="232" class="small">不是「这次怎么修好的」，是「一直如此」</text>
    <text x="430" y="212" class="cell">2,200 + 1,375 字符，硬上限</text>
    <text x="430" y="232" class="small">不衰减，满了要人（Agent）腾位置</text>
    <text x="640" y="219" class="cell">每个会话开头</text>
  </g>

  <!-- 行 3 技能 -->
  <g>
    <rect x="24" y="262" width="752" height="66" rx="8" fill="#ffffff" stroke="#f0ece3"/>
    <rect x="24" y="274" width="3" height="42" rx="1.5" fill="#2f6feb"/>
    <text x="36" y="288" class="mono">SKILL.md</text>
    <text x="36" y="306" class="small">+ references/ scripts/</text>
    <text x="200" y="286" class="cell">某一类任务怎么做：步骤、陷阱、验收</text>
    <text x="200" y="306" class="small">可以长，因为默认不进上下文</text>
    <text x="430" y="286" class="cell">正文不限；索引约 3.2k tokens</text>
    <text x="430" y="306" class="small">14 天空置转 stale，30 天归档</text>
    <text x="640" y="293" class="cell">按需 <tspan class="mono">skill_view</tspan></text>
  </g>

  <!-- 行 4 会话库 -->
  <g>
    <rect x="24" y="336" width="752" height="66" rx="8" fill="#ffffff" stroke="#f0ece3"/>
    <rect x="24" y="348" width="3" height="42" rx="1.5" fill="#7b5cd6"/>
    <text x="36" y="362" class="mono">state.db</text>
    <text x="36" y="380" class="small">FTS5 全文索引</text>
    <text x="200" y="360" class="cell">原始对话，一字不改地留着</text>
    <text x="200" y="380" class="small">不加工，所以能事后追问细节</text>
    <text x="430" y="360" class="cell">磁盘（本机 208 MB / 137 会话）</text>
    <text x="430" y="380" class="small">按需清理，不参与自动遗忘</text>
    <text x="640" y="367" class="cell">检索时才取</text>
  </g>

  <text x="30" y="424" class="note">越靠上越快越贵；越靠下越慢越全。设计动作是「把经验放到刚刚好的那一层」，而不是全塞进上下文。</text>
</svg>