<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Giscus 评论的数据流：博客页面嵌入 giscus iframe，评论存放在 GitHub Discussions">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; fill: #1f2328; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #6b6b6b; }
    .label { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; }
    .cardtitle { font-size: 14px; font-weight: 600; }
    .small { font-size: 11px; fill: #4a4a4a; }
    .muted { fill: #6b6b6b; }
    .note { font-size: 11.5px; fill: #4a4a4a; }
  </style>

  <rect width="800" height="400" fill="#fbfaf7"/>
  <text x="28" y="38" class="title">评论：前端只留一个 iframe</text>
  <text x="28" y="60" class="sub">评论的存储、登录、审核全在 GitHub；站点这边没有任何密钥。</text>

  <!-- 三张卡 -->
  <g>
    <rect x="28" y="90" width="228" height="196" rx="12" fill="#ffffff" stroke="#e5e1d8"/>
    <text x="46" y="116" class="label" fill="#7c5cd6">读者侧</text>
    <text x="46" y="146" class="cardtitle">文章页底部</text>
    <text x="46" y="172" class="small">一个 &lt;iframe&gt;</text>
    <text x="46" y="192" class="small">主题切换时 postMessage</text>
    <text x="46" y="212" class="small">未登录只显示登录按钮</text>
    <text x="46" y="232" class="small">不阻塞正文加载</text>
    <text x="46" y="262" class="small muted">data-theme 变化 → 同步</text>
  </g>

  <g>
    <rect x="286" y="90" width="228" height="196" rx="12" fill="#ffffff" stroke="#e5e1d8"/>
    <text x="304" y="116" class="label" fill="#2f6feb">托管服务</text>
    <text x="304" y="146" class="cardtitle">giscus.app</text>
    <text x="304" y="172" class="small">静态脚本，无数据库</text>
    <text x="304" y="192" class="small">GitHub OAuth 登录</text>
    <text x="304" y="212" class="small">用 GraphQL 读写讨论</text>
    <text x="304" y="232" class="small">不保存评论内容</text>
    <text x="304" y="262" class="small muted">前端不需要 secret</text>
  </g>

  <g>
    <rect x="544" y="90" width="228" height="196" rx="12" fill="#ffffff" stroke="#e5e1d8"/>
    <text x="562" y="116" class="label" fill="#2f8f5b">存储与审核</text>
    <text x="562" y="146" class="cardtitle">GitHub Discussions</text>
    <text x="562" y="172" class="small">仓库 Zuckli/blog-comments</text>
    <text x="562" y="192" class="small">一个页面 = 一条讨论</text>
    <text x="562" y="212" class="small">首条评论时才创建</text>
    <text x="562" y="232" class="small">分类必须是 Open 类型</text>
    <text x="562" y="262" class="small muted">删 / 锁 / 置顶都在 GitHub</text>
  </g>

  <!-- 连接箭头 -->
  <g stroke="#b9b2a3" stroke-width="1.4" fill="none">
    <path d="M258 178 L282 178" marker-end="url(#c1)"/>
    <path d="M282 198 L258 198" marker-end="url(#c1)"/>
    <path d="M516 178 L540 178" marker-end="url(#c1)"/>
    <path d="M540 198 L516 198" marker-end="url(#c1)"/>
  </g>
  <text x="270" y="168" class="muted" font-size="9.5" text-anchor="middle">加载 iframe</text>
  <text x="528" y="168" class="muted" font-size="9.5" text-anchor="middle">GraphQL</text>

  <!-- 三条经验 -->
  <g>
    <rect x="28" y="310" width="744" height="66" rx="10" fill="#f5f1e8"/>
    <text x="46" y="332" class="note">① 分类选 General：Announcements 只有管理员能建帖，访客登录了也发不出评论。</text>
    <text x="46" y="352" class="note">② 新文章显示 0 条评论是正常的：discussion 在第一条评论发出时才创建。</text>
    <text x="46" y="372" class="note">③ 评论框默认只看系统配色，站点手动切主题时必须自己 postMessage 同步一次。</text>
  </g>

  <defs>
    <marker id="c1" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#b9b2a3"/>
    </marker>
  </defs>
</svg>