<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-label="搜索索引在构建时生成，运行时只加载命中的索引分片">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; fill: #1f2328; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #6b6b6b; }
    .label { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; }
    .box { font-size: 11.5px; font-weight: 600; }
    .mini { font-size: 9.5px; fill: #6b6b6b; }
    .muted { fill: #6b6b6b; }
  </style>

  <rect width="800" height="380" fill="#fbfaf7"/>
  <text x="28" y="38" class="title">搜索：把索引也变成构建产物</text>
  <text x="28" y="60" class="sub">没有后端，也不请求第三方。索引在 CI 里生成，和 HTML 一起上传。</text>

  <!-- 构建时 -->
  <rect x="28" y="82" width="744" height="120" rx="12" fill="#f5f1e8"/>
  <text x="44" y="105" class="label" fill="#8a6a3a">构建时 · 每次 PUSH 执行一次</text>

  <g>
    <rect x="44" y="120" width="122" height="56" rx="8" fill="#ffffff" stroke="#e0dacd"/>
    <text x="54" y="142" class="box">Markdown</text><text x="54" y="160" class="mini">content/posts/</text>

    <rect x="178" y="120" width="122" height="56" rx="8" fill="#ffffff" stroke="#e0dacd"/>
    <text x="188" y="142" class="box">Hugo</text><text x="188" y="160" class="mini">渲染 + 压缩</text>

    <rect x="312" y="120" width="122" height="56" rx="8" fill="#ffffff" stroke="#e0dacd"/>
    <text x="322" y="142" class="box">public/*.html</text><text x="322" y="160" class="mini">38 个页面</text>

    <rect x="446" y="120" width="122" height="56" rx="8" fill="#ffffff" stroke="#e0dacd"/>
    <text x="456" y="142" class="box">Pagefind</text><text x="456" y="160" class="mini">扫描 5 个页面</text>

    <rect x="580" y="120" width="176" height="56" rx="8" fill="#ffffff" stroke="#e0dacd"/>
    <text x="590" y="142" class="box">pagefind/*.pf</text><text x="590" y="160" class="mini">索引分片 · 656 KB</text>
  </g>

  <g stroke="#b9b2a3" stroke-width="1.3" fill="none">
    <path d="M166 148 L174 148" marker-end="url(#a2)"/>
    <path d="M300 148 L308 148" marker-end="url(#a2)"/>
    <path d="M434 148 L442 148" marker-end="url(#a2)"/>
    <path d="M568 148 L576 148" marker-end="url(#a2)"/>
  </g>

  <!-- 运行时 -->
  <rect x="28" y="218" width="744" height="120" rx="12" fill="#edf3fd"/>
  <text x="44" y="241" class="label" fill="#2f5bb7">运行时 · 每个读者</text>

  <g>
    <rect x="44" y="256" width="170" height="56" rx="8" fill="#ffffff" stroke="#cfdcf3"/>
    <text x="54" y="278" class="box">输入关键词</text><text x="54" y="296" class="mini">静态 UI，无后端</text>

    <rect x="228" y="256" width="170" height="56" rx="8" fill="#ffffff" stroke="#cfdcf3"/>
    <text x="238" y="278" class="box">pagefind.js</text><text x="238" y="296" class="mini">46 KB，按需加载</text>

    <rect x="412" y="256" width="170" height="56" rx="8" fill="#ffffff" stroke="#cfdcf3"/>
    <text x="422" y="278" class="box">命中分片</text><text x="422" y="296" class="mini">只取相关的几 KB</text>

    <rect x="596" y="256" width="160" height="56" rx="8" fill="#ffffff" stroke="#cfdcf3"/>
    <text x="606" y="278" class="box">标题 + 高亮</text><text x="606" y="296" class="mini">不是 undefined</text>
  </g>

  <g stroke="#8fa9d8" stroke-width="1.3" fill="none">
    <path d="M214 284 L224 284" marker-end="url(#a3)"/>
    <path d="M398 284 L408 284" marker-end="url(#a3)"/>
    <path d="M582 284 L592 284" marker-end="url(#a3)"/>
  </g>

  <!-- 构建产物复用 -->
  <path d="M648 202 L648 214" stroke="#b9b2a3" stroke-width="1.3" stroke-dasharray="3 3" fill="none" marker-end="url(#a2)"/>
  <text x="540" y="211" class="mini" text-anchor="end">同一个 public/ 目录直接部署</text>

  <text x="28" y="366" class="sub">一次搜索 = 几次静态文件请求。没有 API、没有第三方脚本、没有按量计费。</text>

  <defs>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#b9b2a3"/>
    </marker>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#8fa9d8"/>
    </marker>
  </defs>
</svg>