{{- /* Giscus（GitHub Discussions）评论。未配置 id 时显示占位提示，不加载第三方脚本 */ -}}
{{- $c := site.Params.comments.giscus -}}
{{- if and (eq .Type "posts") (.Param "comments") -}}
  {{- if and $c.repo $c.repoID $c.categoryID -}}
  <div class="comments">
    <script src="https://giscus.app/client.js"
      data-repo="{{ $c.repo }}"
      data-repo-id="{{ $c.repoID }}"
      data-category="{{ $c.category }}"
      data-category-id="{{ $c.categoryID }}"
      data-mapping="{{ $c.mapping | default "pathname" }}"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="top"
      data-theme="preferred_color_scheme"
      data-lang="{{ $c.lang | default "zh-CN" }}"
      crossorigin="anonymous"
      async>
    </script>
  </div>
  <script>
    // 让 giscus 跟随站点的手动主题切换（它默认只看系统配色）
    (() => {
      const isDark = () => document.documentElement.dataset.theme === "dark";
      let last = null;
      const push = (force) => {
        const theme = isDark() ? "dark" : "light";
        if (!force && theme === last) return;
        last = theme;
        const f = document.querySelector("iframe.giscus-frame");
        if (f && f.contentWindow) {
          f.contentWindow.postMessage({ giscus: { setConfig: { theme } } }, "https://giscus.app");
        }
      };
      new MutationObserver(() => push(false)).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"],
      });
      // giscus 加载完成会 postMessage，用它当"iframe 已就绪"的信号同步一次
      window.addEventListener("message", (e) => {
        if (e.origin === "https://giscus.app" && last === null) push(true);
      });
    })();
  </script>
  {{- else -}}
  <div class="comments comments--unconfigured">
    <p>评论区还没开通。想聊这篇的话，可以先在 <a href="https://github.com/Zuckli" target="_blank" rel="noopener">GitHub</a> 上找我。</p>
  </div>
  {{- end -}}
{{- end -}}
