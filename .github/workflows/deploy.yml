name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # canonical / sitemap / RSS 全部基于 baseURL：GitHub Pages 是主站，
      # workers.dev 那份只是镜像，所以两边用同一个 baseURL 构建。
      - name: Build
        run: npm run build
        env:
          HUGO_BASEURL: ${{ vars.SITE_URL || 'https://zuckli.github.io/' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      # 镜像部署：失败不影响主站发布（不写 if: secrets.*，step 级 if 上下文里读不到 secrets）
      - name: Deploy mirror to Cloudflare
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy